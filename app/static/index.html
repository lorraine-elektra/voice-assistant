<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice Assistant</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232342d6'/%3E%3Cpath d='M5 16h4l3-8 4 16 3-12 2 4h6' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preload" href="/static/fonts/young-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Voice Assistant</h1>
    <ul id="modes" aria-label="Active modes"></ul>
    <button id="open-setup" type="button" class="btn quiet" hidden>Assistant settings</button>
  </header>

  <main>
    <!-- Step one: name the assistant and pick how it sounds. -->
    <section id="setup" aria-labelledby="setup-title">
      <div class="setup-preview">
        <div id="preview-robot"></div>
        <p id="preview-name" class="preview-name">Your assistant</p>
      </div>
      <form id="setup-form" class="setup-form" autocomplete="off">
        <h2 id="setup-title">Set up your assistant</h2>

        <div class="field">
          <label for="name">Name</label>
          <input id="name" type="text" maxlength="30" placeholder="For example, Ama" enterkeyhint="done">
          <p class="help">Optional. The assistant answers to this name.</p>
        </div>

        <fieldset class="field">
          <legend>Voice type</legend>
          <div class="segmented">
            <label><input type="radio" name="gender" value="woman" checked><span>Woman</span></label>
            <label><input type="radio" name="gender" value="man"><span>Man</span></label>
          </div>
        </fieldset>

        <div class="field">
          <label for="language">Language</label>
          <select id="language"></select>
        </div>

        <div class="field">
          <label for="voice">Voice</label>
          <select id="voice"></select>
          <p class="help" id="voice-help"></p>
        </div>

        <button id="start" type="submit" class="btn primary">Start talking</button>
      </form>
    </section>

    <!-- Step two: the conversation. You on the left, the assistant on the right. -->
    <section id="chat" hidden>
      <div class="stage" id="stage" data-state="connecting">
        <figure class="seat you">
          <div id="you-robot"></div>
          <figcaption>You</figcaption>
        </figure>
        <div class="strip" aria-label="Conversation state">
          <canvas id="wave" aria-hidden="true"></canvas>
          <p id="status" role="status" aria-live="polite">Connecting</p>
          <p id="latency" hidden>
            <span id="latency-text"></span>
            <span class="goal" aria-hidden="true"><i id="latency-bar"></i></span>
          </p>
        </div>
        <figure class="seat assistant">
          <div id="bot-robot"></div>
          <figcaption id="bot-name">Assistant</figcaption>
        </figure>
      </div>

      <div id="transcript" role="log" aria-label="Conversation" aria-live="polite" tabindex="0">
        <p class="hint" id="hint">Press the microphone and talk, or type a message below.</p>
      </div>

      <p id="banner" role="alert" hidden></p>

      <form id="typed" autocomplete="off">
        <button id="mic" type="button" aria-pressed="false" data-state="idle">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12z"/></svg>
          <span class="sr-only" id="mic-label">Start listening</span>
        </button>
        <label for="text" class="sr-only">Type a message</label>
        <input id="text" type="text" placeholder="Or type a message" enterkeyhint="send">
        <button type="submit" class="btn primary send">Send</button>
        <button id="stop" type="button" class="btn" hidden>Stop <kbd>Esc</kbd></button>
      </form>
    </section>
  </main>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
