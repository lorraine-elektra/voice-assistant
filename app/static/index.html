<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice Assistant</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e8590c'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Voice Assistant</h1>
    <ul id="modes" aria-label="Active modes"></ul>
  </header>

  <main>
    <div id="transcript" role="log" aria-label="Conversation" aria-live="polite" tabindex="0">
      <p class="hint" id="hint">Press the microphone and talk, or type a message below.</p>
    </div>

    <p id="banner" role="alert" hidden></p>

    <section class="controls" aria-label="Controls">
      <button id="mic" type="button" aria-pressed="false" data-state="idle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12z"/></svg>
        <span class="sr-only" id="mic-label">Start listening</span>
      </button>
      <p id="status" role="status" aria-live="polite">Connecting</p>
      <p id="latency" hidden></p>
      <button id="stop" type="button" hidden>Stop <kbd>Esc</kbd></button>
    </section>

    <form id="typed" autocomplete="off">
      <label for="text" class="sr-only">Type a message</label>
      <input id="text" type="text" placeholder="Type a message" enterkeyhint="send">
      <button type="submit">Send</button>
    </form>
  </main>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
